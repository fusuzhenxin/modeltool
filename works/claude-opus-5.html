<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Claude Opus 5 的鹈鹕骑车</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #f4f7fb; }
    body { display: grid; place-items: center; }
    svg { width: min(92vw, 760px); height: auto; }
    footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px; text-align: center; font: 12px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; color: #5c6b88; background: rgba(255,255,255,.92); }
    footer a { color: #3b5ffa; }
  </style>
</head>
<body>

Dataset: https://huggingface.co/datasets/sergiopaniego/pelican-svg-drawings
This file is one SVG from that dataset, wrapped in HTML without changing the drawing.

File: svg/claude-opus-5__pelican_bicycle__000.svg

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- background -->
  <rect width="400" height="300" fill="#dff1fa"/>
  <circle cx="330" cy="55" r="22" fill="#ffe9a8"/>
  <ellipse cx="90" cy="60" rx="40" ry="14" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="120" cy="52" rx="26" ry="12" fill="#ffffff" opacity="0.8"/>
  <rect x="0" y="272" width="400" height="28" fill="#b9dfa0"/>
  <line x1="0" y1="272" x2="400" y2="272" stroke="#8cc072" stroke-width="3"/>

  <!-- ================= BICYCLE ================= -->
  <!-- rear wheel -->
  <circle cx="110" cy="225" r="45" fill="none" stroke="#333" stroke-width="6"/>
  <g stroke="#777" stroke-width="1.5">
    <line x1="110" y1="180" x2="110" y2="270"/>
    <line x1="65" y1="225" x2="155" y2="225"/>
    <line x1="78" y1="193" x2="142" y2="257"/>
    <line x1="78" y1="257" x2="142" y2="193"/>
  </g>
  <circle cx="110" cy="225" r="5" fill="#444"/>

  <!-- front wheel -->
  <circle cx="290" cy="225" r="45" fill="none" stroke="#333" stroke-width="6"/>
  <g stroke="#777" stroke-width="1.5">
    <line x1="290" y1="180" x2="290" y2="270"/>
    <line x1="245" y1="225" x2="335" y2="225"/>
    <line x1="258" y1="193" x2="322" y2="257"/>
    <line x1="258" y1="257" x2="322" y2="193"/>
  </g>
  <circle cx="290" cy="225" r="5" fill="#444"/>

  <!-- frame -->
  <g stroke="#c0392b" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="200" y1="225" x2="185" y2="155"/>
    <line x1="200" y1="225" x2="256" y2="152"/>
    <line x1="185" y1="155" x2="256" y2="152"/>
    <line x1="185" y1="155" x2="110" y2="225"/>
    <line x1="200" y1="225" x2="110" y2="225"/>
    <line x1="256" y1="152" x2="290" y2="225"/>
  </g>
  <!-- chain -->
  <line x1="200" y1="225" x2="110" y2="225" stroke="#555" stroke-width="2"/>
  <circle cx="200" cy="225" r="13" fill="none" stroke="#555" stroke-width="3"/>

  <!-- crank & pedal -->
  <line x1="200" y1="225" x2="214" y2="246" stroke="#444" stroke-width="4" stroke-linecap="round"/>
  <rect x="204" y="245" width="24" height="6" rx="2" fill="#333"/>

  <!-- seat -->
  <path d="M165 150 Q182 141 198 150 Q182 156 165 150 Z" fill="#3b2b22"/>

  <!-- handlebars -->
  <path d="M256 152 L262 128 Q264 118 276 118" fill="none" stroke="#444" stroke-width="6" stroke-linecap="round"/>
  <circle cx="278" cy="118" r="5" fill="#222"/>

  <!-- ================= PELICAN ================= -->
  <!-- leg -->
  <path d="M182 142 L200 195 L216 243" fill="none" stroke="#f0932b" stroke-width="7" stroke-linecap="round"/>
  <path d="M216 243 L232 249" fill="none" stroke="#e08b1e" stroke-width="6" stroke-linecap="round"/>

  <!-- tail -->
  <path d="M132 108 L96 92 L112 116 L92 124 L128 134 Z" fill="#f2f2f2" stroke="#c9ccd1" stroke-width="2"/>

  <!-- body -->
  <ellipse cx="172" cy="112" rx="48" ry="37" fill="#fdfdfd" stroke="#c9ccd1" stroke-width="2.5"/>

  <!-- neck -->
  <path d="M198 88 Q214 50 240 46 Q252 48 250 62 Q234 66 220 100 Z" fill="#fdfdfd" stroke="#c9ccd1" stroke-width="2.5"/>

  <!-- head -->
  <circle cx="247" cy="55" r="19" fill="#ffffff" stroke="#c9ccd1" stroke-width="2.5"/>
  <path d="M236 39 Q248 30 258 40 Q248 36 236 39 Z" fill="#e8e8e8"/>

  <!-- pouch -->
  <path d="M262 60 Q266 100 298 96 Q328 90 334 66 Z" fill="#ffb85c" stroke="#e08b1e" stroke-width="2"/>
  <!-- upper beak -->
  <path d="M258 44 L336 60 Q342 63 336 67 L260 70 Z" fill="#f9a03f" stroke="#d97e1c" stroke-width="2"/>
  <circle cx="337" cy="61" r="2.4" fill="#8a4a08"/>

  <!-- eye -->
  <circle cx="252" cy="49" r="4.2" fill="#2c3e50"/>
  <circle cx="253.3" cy="47.7" r="1.4" fill="#ffffff"/>

  <!-- wing reaching handlebar -->
  <path d="M152 96 Q196 96 244 128 Q262 138 274 120 Q258 148 232 142 Q186 132 156 122 Z"
        fill="#f4f6f8" stroke="#c0c5cb" stroke-width="2.5"/>
  <path d="M176 112 Q206 118 234 134" fill="none" stroke="#d8dce0" stroke-width="2"/>
  <path d="M166 122 Q198 130 224 142" fill="none" stroke="#d8dce0" stroke-width="2"/>
</svg>
<footer>Claude Opus 5 画的鹈鹕骑车。数据集 <a href="https://huggingface.co/datasets/sergiopaniego/pelican-svg-drawings">pelican-svg-drawings</a>，Apache-2.0。</footer>
