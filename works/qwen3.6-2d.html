<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Qwen3.6-27B 的 2D 动画鹈鹕骑车</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #f4f7fb; }
    body { display: grid; place-items: center; }
    svg { width: min(92vw, 760px); height: auto; }
    footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px; text-align: center; font: 12px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; color: #5c6b88; background: rgba(255,255,255,.92); }
    footer a { color: #3b5ffa; }
  </style>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <!-- Sky -->
  <rect width="600" height="500" fill="#87CEEB"/>
  
  <!-- Sun -->
  <circle cx="520" cy="70" r="40" fill="#FFD700"/>
  <line x1="520" y1="15" x2="520" y2="5" stroke="#FFD700" stroke-width="3"/>
  <line x1="520" y1="125" x2="520" y2="135" stroke="#FFD700" stroke-width="3"/>
  <line x1="465" y1="70" x2="455" y2="70" stroke="#FFD700" stroke-width="3"/>
  <line x1="575" y1="70" x2="585" y2="70" stroke="#FFD700" stroke-width="3"/>
  <line x1="481" y1="31" x2="474" y2="24" stroke="#FFD700" stroke-width="3"/>
  <line x1="559" y1="109" x2="566" y2="116" stroke="#FFD700" stroke-width="3"/>
  <line x1="481" y1="109" x2="474" y2="116" stroke="#FFD700" stroke-width="3"/>
  <line x1="559" y1="31" x2="566" y2="24" stroke="#FFD700" stroke-width="3"/>
  
  <!-- Clouds -->
  <ellipse cx="100" cy="60" rx="50" ry="25" fill="white" opacity="0.9"/>
  <ellipse cx="130" cy="50" rx="40" ry="20" fill="white" opacity="0.9"/>
  <ellipse cx="70" cy="55" rx="35" ry="18" fill="white" opacity="0.9"/>
  
  <ellipse cx="350" cy="45" rx="45" ry="22" fill="white" opacity="0.8"/>
  <ellipse cx="380" cy="38" rx="35" ry="18" fill="white" opacity="0.8"/>
  
  <!-- Ground -->
  <rect x="0" y="420" width="600" height="80" fill="#4CAF50"/>
  <rect x="0" y="415" width="600" height="10" fill="#66BB6A" rx="5"/>
  
  <!-- Road -->
  <rect x="0" y="425" width="600" height="40" fill="#555" rx="3"/>
  <line x1="0" y1="445" x2="600" y2="445" stroke="#FFD700" stroke-width="2" stroke-dasharray="20,15"/>
  
  <!-- Speed lines -->
  <line x1="50" y1="350" x2="100" y2="350" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="30" y1="370" x2="90" y2="370" stroke="white" stroke-width="2" opacity="0.4"/>
  <line x1="60" y1="390" x2="110" y2="390" stroke="white" stroke-width="2" opacity="0.3"/>
  
  <!-- ===== BICYCLE ===== -->
  
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 180 380" to="360 180 380" dur="1.2s" repeatCount="indefinite"/>
  <!-- Back wheel -->
  <circle cx="180" cy="380" r="55" fill="none" stroke="#222" stroke-width="5"/>
  <circle cx="180" cy="380" r="50" fill="none" stroke="#888" stroke-width="2"/>
  <circle cx="180" cy="380" r="8" fill="#666" stroke="#444" stroke-width="2"/>
  <!-- Back wheel spokes -->
  <line x1="180" y1="330" x2="180" y2="430" stroke="#aaa" stroke-width="1.5"/>
  <line x1="130" y1="380" x2="230" y2="380" stroke="#aaa" stroke-width="1.5"/>
  <line x1="145" y1="345" x2="215" y2="415" stroke="#aaa" stroke-width="1.5"/>
  <line x1="215" y1="345" x2="145" y2="415" stroke="#aaa" stroke-width="1.5"/>
  <line x1="135" y1="355" x2="225" y2="405" stroke="#aaa" stroke-width="1.5"/>
  <line x1="225" y1="355" x2="135" y2="405" stroke="#aaa" stroke-width="1.5"/>
  </g>
  
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 420 380" to="360 420 380" dur="1.2s" repeatCount="indefinite"/>
  <!-- Front wheel -->
  <circle cx="420" cy="380" r="55" fill="none" stroke="#222" stroke-width="5"/>
  <circle cx="420" cy="380" r="50" fill="none" stroke="#888" stroke-width="2"/>
  <circle cx="420" cy="380" r="8" fill="#666" stroke="#444" stroke-width="2"/>
  <!-- Front wheel spokes -->
  <line x1="420" y1="330" x2="420" y2="430" stroke="#aaa" stroke-width="1.5"/>
  <line x1="370" y1="380" x2="470" y2="380" stroke="#aaa" stroke-width="1.5"/>
  <line x1="385" y1="345" x2="455" y2="415" stroke="#aaa" stroke-width="1.5"/>
  <line x1="455" y1="345" x2="385" y2="415" stroke="#aaa" stroke-width="1.5"/>
  <line x1="375" y1="355" x2="465" y2="405" stroke="#aaa" stroke-width="1.5"/>
  <line x1="465" y1="355" x2="375" y2="405" stroke="#aaa" stroke-width="1.5"/>
  </g>
  
  <!-- Bicycle frame -->
  <!-- Seat tube -->
  <line x1="240" y1="280" x2="290" y2="380" stroke="#E53935" stroke-width="5" stroke-linecap="round"/>
  <!-- Down tube -->
  <line x1="240" y1="280" x2="380" y2="380" stroke="#E53935" stroke-width="5" stroke-linecap="round"/>
  <!-- Top tube -->
  <line x1="240" y1="280" x2="370" y2="280" stroke="#E53935" stroke-width="5" stroke-linecap="round"/>
  <!-- Chain stay -->
  <line x1="290" y1="380" x2="420" y2="380" stroke="#E53935" stroke-width="4" stroke-linecap="round"/>
  <!-- Seat stay -->
  <line x1="240" y1="280" x2="180" y2="380" stroke="#E53935" stroke-width="4" stroke-linecap="round"/>
  <!-- Fork -->
  <line x1="380" y1="280" x2="420" y2="380" stroke="#E53935" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Handlebars -->
  <line x1="370" y1="280" x2="380" y2="240" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <line x1="360" y1="240" x2="400" y2="240" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <!-- Handlebar grips -->
  <line x1="355" y1="240" x2="365" y2="240" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  <line x1="395" y1="240" x2="405" y2="240" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Seat post -->
  <line x1="240" y1="280" x2="235" y2="255" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <!-- Seat -->
  <ellipse cx="235" cy="252" rx="25" ry="8" fill="#333"/>
  <ellipse cx="235" cy="249" rx="22" ry="6" fill="#555"/>
  
  <!-- Crank and pedals -->
  <circle cx="290" cy="380" r="10" fill="#777" stroke="#555" stroke-width="2"/>
  <!-- Left pedal arm -->
  <line x1="290" y1="380" x2="270" y2="400" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <rect x="260" y="397" width="20" height="6" rx="2" fill="#444"/>
  <!-- Right pedal arm -->
  <line x1="290" y1="380" x2="310" y2="360" stroke="#555" stroke-width="4" stroke-linecap="round"/>
  <rect x="300" y="357" width="20" height="6" rx="2" fill="#444"/>
  
  <!-- Chain -->
  <ellipse cx="355" cy="380" rx="65" ry="10" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="4,3"/>
  
  <!-- ===== PELICAN ===== -->
  
  <!-- Pelican body -->
  <ellipse cx="250" cy="200" rx="50" ry="65" fill="white" stroke="#ddd" stroke-width="1.5"/>
  
  <!-- Pelican belly shading -->
  <ellipse cx="260" cy="210" rx="35" ry="50" fill="#F5F5F0"/>
  
  <!-- Pelican head -->
  <circle cx="280" cy="120" r="35" fill="white" stroke="#ddd" stroke-width="1.5"/>
  
  <!-- Pelican neck connection -->
  <path d="M265,155 Q260,180 255,200 L285,200 Q280,180 275,155 Z" fill="white" stroke="#ddd" stroke-width="1"/>
  
  <!-- Pelican eye -->
  <circle cx="290" cy="112" r="6" fill="white" stroke="#333" stroke-width="1.5"/>
  <circle cx="292" cy="111" r="3" fill="#222"/>
  <circle cx="293" cy="110" r="1.2" fill="white"/>
  
  <!-- Pelican eyebrow -->
  <path d="M282,103 Q290,98 300,102" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Pelican beak (top) -->
  <path d="M310,110 L380,115 Q390,117 385,125 L310,120 Z" fill="#F4A460" stroke="#D2873B" stroke-width="1.5"/>
  
  <!-- Pelican beak pouch (bottom) -->
  <path d="M310,120 Q340,165 370,155 Q385,148 385,125 L380,115 Q360,118 310,120 Z" fill="#F4A460" stroke="#D2873B" stroke-width="1.5"/>
  
  <!-- Pouch inner detail -->
  <path d="M315,125 Q340,155 365,148" fill="none" stroke="#E8955A" stroke-width="1"/>
  
  <!-- Beak tip -->
  <path d="M380,115 Q390,117 385,125" fill="none" stroke="#D2873B" stroke-width="2"/>
  
  <!-- Pelican wing (left, reaching to handlebars) -->
  <path d="M220,180 Q200,190 210,220 Q220,250 260,260 Q280,265 300,255 Q310,248 305,240 Q295,235 280,230 Q250,220 240,200 Q235,190 220,180 Z" fill="#F0F0E8" stroke="#ccc" stroke-width="1.5"/>
  
  <!-- Wing feathers detail -->
  <path d="M230,200 Q250,210 270,215" fill="none" stroke="#ddd" stroke-width="1"/>
  <path d="M225,210 Q245,220 265,225" fill="none" stroke="#ddd" stroke-width="1"/>
  <path d="M228,220 Q248,230 268,235" fill="none" stroke="#ddd" stroke-width="1"/>
  
  <!-- Wing tip on handlebar -->
  <ellipse cx="300" cy="248" rx="12" ry="8" fill="#F0F0E8" stroke="#ccc" stroke-width="1.5" transform="rotate(-15, 300, 248)"/>
  
  <!-- Pelican leg (left, on pedal) -->
  <line x1="240" y1="260" x2="225" y2="310" stroke="#F4A460" stroke-width="5" stroke-linecap="round"/>
  <line x1="225" y1="310" x2="270" y2="400" stroke="#F4A460" stroke-width="5" stroke-linecap="round"/>
  <!-- Left foot -->
  <ellipse cx="268" cy="402" rx="12" ry="5" fill="#F4A460" stroke="#D2873B" stroke-width="1"/>
  
  <!-- Pelican leg (right, on other pedal) -->
  <line x1="260" y1="260" x2="280" y2="310" stroke="#F4A460" stroke-width="5" stroke-linecap="round"/>
  <line x1="280" y1="310" x2="310" y2="360" stroke="#F4A460" stroke-width="5" stroke-linecap="round"/>
  <!-- Right foot -->
  <ellipse cx="312" cy="362" rx="12" ry="5" fill="#F4A460" stroke="#D2873B" stroke-width="1"/>
  
  <!-- Pelican tail feathers -->
  <path d="M200,210 Q185,200 175,195 Q185,205 180,215 Q190,210 200,210 Z" fill="#F0F0E8" stroke="#ccc" stroke-width="1"/>
  <path d="M200,215 Q180,210 170,208 Q180,218 175,225 Q185,220 200,215 Z" fill="#F0F0E8" stroke="#ccc" stroke-width="1"/>
  <path d="M200,220 Q185,225 178,230 Q188,228 182,238 Q192,230 200,220 Z" fill="#F0F0E8" stroke="#ccc" stroke-width="1"/>
  
  <!-- Small tuft of feathers on head -->
  <path d="M270,88 Q265,75 272,70 Q268,80 275,88 Z" fill="white" stroke="#ddd" stroke-width="1"/>
  <path d="M275,87 Q273,72 280,68 Q277,78 280,87 Z" fill="white" stroke="#ddd" stroke-width="1"/>
  
  <!-- Motion blur lines behind -->
  <line x1="120" y1="200" x2="160" y2="200" stroke="#ccc" stroke-width="2" opacity="0.5"/>
  <line x1="110" y1="220" x2="150" y2="220" stroke="#ccc" stroke-width="2" opacity="0.4"/>
  <line x1="130" y1="240" x2="165" y2="240" stroke="#ccc" stroke-width="2" opacity="0.3"/>
  
  <!-- Grass tufts -->
  <path d="M50,420 Q52,408 55,420" fill="none" stroke="#388E3C" stroke-width="2"/>
  <path d="M55,420 Q58,410 60,420" fill="none" stroke="#388E3C" stroke-width="2"/>
  <path d="M500,420 Q502,408 505,420" fill="none" stroke="#388E3C" stroke-width="2"/>
  <path d="M505,420 Q508,410 510,420" fill="none" stroke="#388E3C" stroke-width="2"/>
  <path d="M300,420 Q302,410 305,420" fill="none" stroke="#388E3C" stroke-width="2"/>
</svg>
<footer>2D 动画：在 Qwen3.6-27B 的原 SVG 上只加了车轮旋转。数据集 <a href="https://huggingface.co/datasets/sergiopaniego/pelican-svg-drawings">pelican-svg-drawings</a>，Apache-2.0。</footer>
